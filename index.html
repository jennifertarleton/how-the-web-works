<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a Page Reaches You</title>
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 {
      margin: 24px 24px 0;
      font-size: 1.6rem;
      text-align: center;
    }

    .stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      align-items: center;
      gap: 16px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    .machine {
      border: 3px solid var(--ink);
      border-radius: 16px;
      background: white;
      padding: 16px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .machine .label {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .machine .sub {
      color: var(--muted);
      margin-bottom: 12px;
    }

    .emoji {
      font-size: 3rem;
    }

    /* The page the browser builds */
    .built {
      width: 100%;
      flex: 1;
      border: 2px dashed var(--line);
      border-radius: 8px;
      padding: 10px;
      text-align: left;
      font-size: 0.9rem;
    }

    .built > * {
      opacity: 0;
      transition: opacity 0.6s;
    }

    .built .show {
      opacity: 1;
    }

    .built .page-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .built.styled .page-title {
      color: var(--blue);
      font-family: Georgia, serif;
    }

    .built.styled {
      background: #eef5fb;
      border-style: solid;
      border-color: var(--blue);
    }

    .built button {
      font: inherit;
      margin-top: 8px;
      padding: 4px 10px;
      border: none;
      border-radius: 6px;
      background: var(--gold);
      cursor: pointer;
    }

    /* Middle: the internet */
    .middle {
      position: relative;
      height: 280px;
    }

    .wire {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 3px dotted var(--muted);
    }

    .middle .tag {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% + 8px);
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .request {
      position: absolute;
      top: 12%;
      left: 0;
      max-width: 90%;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      font-weight: 600;
      opacity: 0;
      transition: left 1.2s ease-in-out, opacity 0.4s;
    }

    .request.go {
      opacity: 1;
      left: 10%;
    }

    .files {
      position: absolute;
      bottom: 6%;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transition: right 1.4s ease-in-out, opacity 0.4s;
    }

    .files.go {
      opacity: 1;
      right: 55%;
    }

    .file {
      padding: 6px 12px;
      border-radius: 8px;
      font-family: Consolas, monospace;
      font-weight: 700;
      color: white;
    }

    .html { background: var(--red); }
    .css { background: var(--blue); }
    .js { background: var(--gold); color: var(--ink); }

    .server-files {
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.6s;
    }

    .server-files.show {
      opacity: 1;
    }

    /* Caption + controls */
    .caption {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.5rem;
      text-align: center;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 0 24px 24px;
    }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next {
      background: var(--ink);
      color: white;
    }

    .count {
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .stage {
        grid-template-columns: 1fr;
      }

      .middle {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <h1>How a web page reaches you</h1>

  <div class="stage">
    <div class="machine">
      <div class="emoji">💻</div>
      <div class="label">Your browser</div>
      <div class="sub">Chrome, Safari, Edge...</div>
      <div class="built" id="built">
        <div class="page-title" id="b-html">Sunday Book Club</div>
        <div id="b-text">One book a month, good snacks and no pressure.</div>
        <button id="b-js" type="button">Say hi</button>
      </div>
    </div>

    <div class="middle">
      <div class="wire"></div>
      <div class="tag">the internet</div>
      <div class="request" id="request">Please send me<br>your page!</div>
      <div class="files" id="files">
        <span class="file html">index.html</span>
        <span class="file css">style.css</span>
        <span class="file js">script.js</span>
      </div>
    </div>

    <div class="machine">
      <div class="emoji">🗄️</div>
      <div class="label">A server</div>
      <div class="sub" id="server-sub">A computer somewhere else</div>
      <div class="server-files" id="server-files">
        <span class="file html">index.html</span>
        <span class="file css">style.css</span>
        <span class="file js">script.js</span>
      </div>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    const steps = [
      "Two computers: <strong>yours</strong>, and a <strong>server</strong> somewhere else that has the page.",
      "You type an address and press Enter. Your browser sends a message: <strong>please send me this page</strong>.",
      "The server sends back <strong>files</strong>. Not a picture of the page, just text files.",
      "<strong>HTML</strong> is <em>what's on the page</em>: the nouns.",
      "<strong>CSS</strong> is <em>how it looks</em>: the adjectives.",
      "<strong>JavaScript</strong> is <em>what it does</em>: the verbs. Click the button!",
      "For your Week 1 page, the server is <strong>GitHub</strong>. <code>git push</code> put your files there."
    ];

    const el = (id) => document.getElementById(id);
    let step = 0;

    function show() {
      el("server-files").classList.toggle("show", step >= 0);
      el("request").classList.toggle("go", step === 1);
      el("files").classList.toggle("go", step === 2);
      el("b-html").classList.toggle("show", step >= 3);
      el("b-text").classList.toggle("show", step >= 3);
      el("built").classList.toggle("styled", step >= 4);
      el("b-js").classList.toggle("show", step >= 5);
      el("server-sub").textContent = step >= 6 ? "GitHub Pages" : "A computer somewhere else";
      el("caption").innerHTML = steps[step];
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
    }

    el("next").addEventListener("click", () => { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", () => { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });
    el("b-js").addEventListener("click", () => alert("Hi! JavaScript made this happen."));

    show();
  </script>
</body>
</html>
